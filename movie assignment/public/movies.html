
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Information System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            margin: 0;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #movieContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-card h2 {
            color: #007bff;
        }

        .rating {
            color: #e67e22;
            font-weight: bold;
        }

        #message {
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Movie Information System</h1>
        <p>Explore your favorite movies</p>
    </header>

    <button onclick="fetchMovies()">Fetch Movies</button>

    <p id="message">Click Fetch Movies to load movie information.</p>

    <div id="movieContainer"></div>

    <script>
        async function fetchMovies() {
            const container = document.getElementById("movieContainer");
            const message = document.getElementById("message");

            message.innerText = "Loading movies...";
            container.innerHTML = "";

            try {
                const response = await fetch("/movies");

                if (!response.ok) {
                    throw new Error("Failed to fetch movies");
                }

                const movies = await response.json();

                if (movies.length === 0) {
                    message.innerText = "No movies found in database.";
                    return;
                }

                message.innerText = "Total Movies: " + movies.length;

                movies.forEach(movie => {
                    const card = document.createElement("div");
                    card.className = "movie-card";

                    card.innerHTML = `
                        <h2>${movie.title}</h2>
                        <p><strong>Director:</strong> ${movie.director}</p>
                        <p><strong>Year:</strong> ${movie.year}</p>
                        <p><strong>Genre:</strong> ${movie.genre}</p>
                        <p class="rating">⭐ Rating: ${movie.rating}</p>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                message.innerText = "Error loading movies. Check your server.";
            }
        }

        // Automatically fetch movies when page opens
        fetchMovies();
    </script>

</body>
</html>
